name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20.20.2'
      - name: Enable pinned Yarn
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build Emailo dependency
        run: yarn workspace emailo build
      - name: Lint and typecheck
        run: |
          set -euo pipefail
          for package in admin-cli api dashboard isomorphic-lib worker; do
            yarn workspace "$package" lint
            yarn workspace "$package" check
          done

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_NAME_SUFFIX: ci
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: dittofeed_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      clickhouse-server:
        image: clickhouse/clickhouse-server:24.12.6.70-alpine
        env:
          CLICKHOUSE_USER: dittofeed
          CLICKHOUSE_PASSWORD: password
        ports:
          - 8123:8123
          - 9000:9000
          - 9009:9009
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20.20.2'
      - name: Enable pinned Yarn
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build Emailo dependency
        run: yarn workspace emailo build
      - name: Typecheck and test
        run: |
          set -euo pipefail
          # Separate Jest invocations preserve each project's database lifecycle.
          for package in emailo api dashboard; do
            yarn workspace "$package" check
            yarn jest "packages/$package" --maxWorkers=4
          done

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_NAME_SUFFIX: ci
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: dittofeed_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      clickhouse-server:
        image: clickhouse/clickhouse-server:24.12.6.70-alpine
        env:
          CLICKHOUSE_USER: dittofeed
          CLICKHOUSE_PASSWORD: password
        ports:
          - 8123:8123
          - 9000:9000
          - 9009:9009
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20.20.2'
      - name: Enable pinned Yarn
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build Emailo dependency
        run: yarn workspace emailo build
      - name: Typecheck and test backend
        run: |
          set -euo pipefail
          yarn workspace backend-lib check
          yarn jest packages/backend-lib --maxWorkers=4
