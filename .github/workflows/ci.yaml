name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Match packages/lite/Dockerfile, not the retired Node 20 runtime.
          node-version: '24.21.0'
      - name: Enable pinned Yarn
        run: corepack enable
      - name: Cache Yarn downloads
        uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-node24-yarn4.1.1-${{ hashFiles('yarn.lock', '.yarnrc.yml', '.yarn/releases/yarn-4.1.1.cjs') }}
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build Emailo dependency
        run: yarn workspace emailo build
      # Formatting remains available locally; it must not mask build failures.
      - name: Typecheck application packages
        run: |
          set -euo pipefail
          for package in admin-cli api dashboard isomorphic-lib worker lite tracking-worker mcp; do
            yarn workspace "$package" check
          done
      - name: Build application as shipped
        env:
          NEXT_STANDALONE: 'false'
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          yarn workspace api build
          yarn workspace worker build
          yarn workspace admin-cli build
          yarn workspace dashboard build
          yarn workspace lite build
      - name: Test MCP and tracking Worker
        run: |
          set -euo pipefail
          yarn workspace mcp test
          yarn workspace tracking-worker test

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_NAME_SUFFIX: ci
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: dittofeed_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      clickhouse-server:
        image: clickhouse/clickhouse-server:24.12.6.70-alpine
        env:
          CLICKHOUSE_USER: dittofeed
          CLICKHOUSE_PASSWORD: password
        ports:
          - 8123:8123
          - 9000:9000
          - 9009:9009
        options: >-
          --health-cmd "clickhouse-client --user dittofeed --password password --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Match packages/lite/Dockerfile, not the retired Node 20 runtime.
          node-version: '24.21.0'
      - name: Enable pinned Yarn
        run: corepack enable
      - name: Cache Yarn downloads
        uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-node24-yarn4.1.1-${{ hashFiles('yarn.lock', '.yarnrc.yml', '.yarn/releases/yarn-4.1.1.cjs') }}
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build Emailo dependency
        run: yarn workspace emailo build
      - name: Enforce database-free application and MCP parity
        run: yarn check:mcp-parity
      - name: Typecheck and test
        run: |
          set -euo pipefail
          # Separate Jest invocations preserve each project's database lifecycle.
          for package in emailo api dashboard; do
            yarn workspace "$package" check
            yarn jest "packages/$package" --maxWorkers=4
          done

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_NAME_SUFFIX: ci
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: dittofeed_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      clickhouse-server:
        image: clickhouse/clickhouse-server:24.12.6.70-alpine
        env:
          CLICKHOUSE_USER: dittofeed
          CLICKHOUSE_PASSWORD: password
        ports:
          - 8123:8123
          - 9000:9000
          - 9009:9009
        options: >-
          --health-cmd "clickhouse-client --user dittofeed --password password --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Match packages/lite/Dockerfile, not the retired Node 20 runtime.
          node-version: '24.21.0'
      - name: Enable pinned Yarn
        run: corepack enable
      - name: Cache Yarn downloads
        uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-node24-yarn4.1.1-${{ hashFiles('yarn.lock', '.yarnrc.yml', '.yarn/releases/yarn-4.1.1.cjs') }}
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build Emailo dependency
        run: yarn workspace emailo build
      - name: Typecheck and test backend
        run: |
          set -euo pipefail
          yarn workspace backend-lib check
          yarn jest packages/backend-lib --maxWorkers=4
