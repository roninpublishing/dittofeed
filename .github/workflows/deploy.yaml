name: Deploy Dittofeed

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Fork ref or full commit SHA to build (defaults to main)
        required: false
        default: main
        type: string
      deploy:
        description: Activate in production (disable to verify the build only)
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: dittofeed-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build lite and deploy app only
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout deployment tooling
        uses: actions/checkout@v4
        with:
          ref: main
          path: control
          persist-credentials: false
      - name: Test deployment fixtures
        run: python3 -m unittest discover -s control/scripts/deploy -p 'test_*.py' -v
      - name: Checkout selected application revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || 'main' }}
          path: source
          persist-credentials: false
      - name: Resolve immutable source revision
        id: source
        working-directory: source
        run: |
          set -euo pipefail
          revision=$(git rev-parse HEAD)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
      - name: Check restricted deployment access before building
        if: ${{ inputs.deploy }}
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DITTOFEED_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DITTOFEED_DEPLOY_KNOWN_HOSTS }}
        run: python3 control/scripts/deploy/client.py --check
      - name: Set up bounded Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            memory=6g
            cpu-quota=400000
      - name: Authenticate Ronin registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish only lite
        id: image
        uses: docker/build-push-action@v6
        with:
          context: source
          file: source/packages/lite/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/roninpublishing/dittofeed-lite:sha-${{ steps.source.outputs.revision }}
          build-args: APP_VERSION=${{ steps.source.outputs.revision }}
          cache-from: type=gha,scope=lite-amd64
          cache-to: type=gha,mode=max,scope=lite-amd64
          labels: |
            org.opencontainers.image.source=https://github.com/roninpublishing/dittofeed
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
      - name: Deploy immutable digest over restricted SSH
        if: ${{ inputs.deploy }}
        env:
          REVISION: ${{ steps.source.outputs.revision }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_SSH_KEY: ${{ secrets.DITTOFEED_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DITTOFEED_DEPLOY_KNOWN_HOSTS }}
        run: python3 control/scripts/deploy/client.py
      - name: Record release identity
        env:
          REVISION: ${{ steps.source.outputs.revision }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          ACTIVATE: ${{ inputs.deploy }}
        run: |
          printf 'Source: `%s`\n\nImage: `ghcr.io/roninpublishing/dittofeed-lite@%s`\n' "$REVISION" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          printf '\nProduction activation requested: `%s`\n' "$ACTIVATE" >> "$GITHUB_STEP_SUMMARY"
